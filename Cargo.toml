[package]
name = "dfnet"
version = "0.1.5"
edition = "2021"
authors = ["tylerstyle <tylerstyle@users.noreply.github.com>"]
description = "Linux network triage, MAC management, read-only shares, verified stream reception and Wi-Fi AP TUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tylerstyle/dfnet"
homepage = "https://github.com/tylerstyle/dfnet"
readme = "README.md"
keywords = ["forensics", "dfir", "network", "macchanger", "tui"]
categories = ["command-line-utilities"]

[dependencies]
dfcore = { path = "../dfcore" }
# dfstream/1 protocol, shared with dflive (sibling path dependency)
dfstream = { path = "../dflive/dfstream" }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.6", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
sha2 = "0.10.9"
libc = "0.2"
