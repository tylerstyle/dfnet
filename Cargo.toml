[package]
name = "dfnet"
version = "0.1.1"
edition = "2021"
authors = ["tylerstyle <tylerstyle@users.noreply.github.com>"]
description = "Modern forensic network triage, stealth MAC cloaking, share ingestion & disk stream receiver TUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tylerstyle/dfnet"
homepage = "https://github.com/tylerstyle/dfnet"
readme = "README.md"
keywords = ["forensics", "dfir", "network", "macchanger", "tui"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.6", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
